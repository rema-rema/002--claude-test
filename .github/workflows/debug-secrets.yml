name: Secrets デバッグ確認

on:
  workflow_dispatch:  # 手動実行のみ

jobs:
  debug-secrets:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check Secrets
      run: |
        echo "=== Secrets 存在確認 ==="
        
        if [ -z "${{ secrets.SSH_USER }}" ]; then
          echo "❌ SSH_USER is empty"
        else
          echo "✅ SSH_USER is set"
        fi
        
        if [ -z "${{ secrets.HOST_IP }}" ]; then
          echo "❌ HOST_IP is empty"
        else
          echo "✅ HOST_IP is set"
          echo "HOST_IP length: ${#HOST_IP}"
        fi
        
        if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
          echo "❌ SSH_PRIVATE_KEY is empty"
        else
          echo "✅ SSH_PRIVATE_KEY is set"
        fi
        
        echo "=== 値の確認 (部分表示) ==="
        echo "SSH_USER: ${{ secrets.SSH_USER }}"
        echo "HOST_IP: '${{ secrets.HOST_IP }}'"
        
      env:
        HOST_IP: ${{ secrets.HOST_IP }}